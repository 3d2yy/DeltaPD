study_name: "Comparative_CH3_P1_P2_P3_G1_G2_G3"

input:
  points_csv: "outputs/thesis_master/thesis_master_prpd_points.csv"
  channel: "CH3"
  dataset_keys:
    - P1
    - P2
    - P3
    - G1
    - G2
    - G3

state_alarm_root: "outputs/state_alarm_ch3"

windowing:
  window_events: 64
  step_events: 16
  min_valid_events: 32
  max_valid_dt_s: 1.0
  fano_bin_count: 8

descriptors:
  search_features:
    - median_dt_s
    - iqr_dt_s
    - p90_dt_s
    - cv_dt
    - cv2_dt
    - local_variation
    - weibull_beta
    - burstiness
    - fano_factor
    - phase_entropy
    - phase_kuramoto_r
    - phase_width_pos_deg
    - phase_width_neg_deg
  reserve_features:
    - phase_inlier_ratio
    - amplitude_balance_ratio
    - mean_peak_v
    - n_events

tasks:
  dataset6:
    type: "multiclass"
    label_column: "dataset_key"
  type3:
    type: "multiclass"
    label_column: "discharge_type"
  variant2:
    type: "binary"
    label_column: "acquisition_variant"
    positive_values: ["gemela"]

search:
  n_splits: 5
  random_seed: 42
  top_k_features: 8
  max_combo_size: 3
  forward_selection_max_features: 5
  score_tolerance: 0.01
  redundancy_threshold: 0.85

report:
  export_pdf: true
  pdf_filename: "comparative_ch3_descriptor_report.pdf"

output_dir: "outputs/comparative_ch3"
