study_name: "CH3_State_Alarm_Batch"
base_dir: "E:/Carpeta definitiva de Tesis/programas"
output_root: "outputs/state_alarm_ch3"

datasets:
  - dataset_key: "P1"
    folder: "Prueba 1 - Internas"
    discharge_type: "internal"
    variant: "benchmark"
  - dataset_key: "P2"
    folder: "Prueba 2 - Superficiales"
    discharge_type: "superficial"
    variant: "benchmark"
  - dataset_key: "P3"
    folder: "Prueba 3 - Ensayo de Fuentes Múltiples Simultáneas"
    discharge_type: "multiple"
    variant: "benchmark"
  - dataset_key: "G1"
    folder: "Prueba 1 - Internas (Gemelas)"
    discharge_type: "internal"
    variant: "gemela"
  - dataset_key: "G2"
    folder: "Prueba 2 - Superficiales (Gemelas)"
    discharge_type: "superficial"
    variant: "gemela"
  - dataset_key: "G3"
    folder: "Prueba 3 - Ensayo de Fuentes Múltiples Simultáneas (Gemelas)"
    discharge_type: "multiple"
    variant: "gemela"

material_defaults:
  antenna_name: "Vivaldi antipodal propuesta"
  preprocess:
    preserve_amplitude: true
    centering: true
    normalization: "none"
    wavelet_denoise: true
  detection:
    k_sigma: 5.0
    refractory_ns: 20
    noise_window_ns: 40
  analysis:
    export_sensitivity_report: true
    stage_aware: true
    stage_boundaries_s: "auto"
    max_valid_dt_s: 1.0
    rolling_window_events: 50
    ewma_alpha: 0.2
    cusum_k: 0.5
    cusum_h: 5.0
    kalman_q: 1e-4
    kalman_r: 1.0
    blind_prpd:
      calibration_method: "auto"
      search_width_hz: 0.25
      coarse_steps: 4001
      refine_half_width_hz: 0.02
      max_events: 20000
      robust_refine: true
      n_harmonics: 4
      bootstrap_iterations: 6
      bootstrap_sample_fraction: 0.75
      bootstrap_seed: 42
      local_window_size_events: 256
      local_window_step_events: 128
      local_min_events_per_window: 128
      local_min_window_count: 3
    bands_ghz:
      - [0.0, 0.5]
      - [0.5, 1.5]
      - [1.5, 2.4]
  plots:
    show_raw_with_detections: true
    show_delta_t_series: true
    show_delta_t_hist: false
    show_rate_series: true
    show_rolling_stats: true
    show_ewma_cusum: true
    show_advanced_stats: true
    show_blind_prpd: true

study_defaults:
  windowing:
    window_events: 64
    step_events: 16
    min_valid_events: 32
    max_valid_dt_s: 1.0
    fano_bin_count: 8
  descriptors:
    search_features:
      - median_dt_s
      - iqr_dt_s
      - p90_dt_s
      - cv_dt
      - cv2_dt
      - local_variation
      - weibull_beta
      - burstiness
      - fano_factor
      - phase_entropy
      - phase_kuramoto_r
      - phase_width_pos_deg
      - phase_width_neg_deg
    reserve_features:
      - phase_inlier_ratio
      - amplitude_balance_ratio
      - mean_peak_v
      - n_events
  tasks:
    state:
      type: "multiclass"
      label_column: "segment"
      fallback_time_segments: 3
    alarm:
      type: "binary"
      label_column: "segment"
      positive_values: [3]
      fallback_time_segments: 3
  search:
    n_splits: 5
    random_seed: 42
    top_k_features: 8
    max_combo_size: 3
    forward_selection_max_features: 5
    score_tolerance: 0.01
    redundancy_threshold: 0.85
  report:
    export_pdf: true
